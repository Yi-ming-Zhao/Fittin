name: Bootstrap Fittin v1.3.0 PR

on:
  push:
    branches:
      - codex/add-flexible-training-cardio-library

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    if: github.repository == 'Yi-ming-Zhao/Fittin'
    runs-on: ubuntu-latest
    steps:
      - name: Create the release pull request once
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'codex/add-flexible-training-cardio-library';
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base: 'main',
            });
            if (existing.data.length > 0) {
              core.info(`PR already exists: ${existing.data[0].html_url}`);
              return;
            }
            const created = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base: 'main',
              title: 'Fittin v1.3.0: flexible training, cardio, themes, and durable login',
              body: [
                '## 概要',
                '',
                '- 支持小周期训练日调整、训练中动作替换和可编辑标签动作库',
                '- 新增类型化有氧记录、GPX/TCX/FIT/CSV 导入和力量/有氧趋势',
                '- 使用轮换刷新会话保持登录，重组“我的”二级信息架构',
                '- 扩充克制配色并允许 Agent 通过确认、冲突与撤销流程管理动作和配色',
                '- 统一所有主页面和深层页面的安全区、留白、键盘避让和 44px 触控区',
                '- 将版本更新为 `1.3.0+26`',
                '',
                '## 验证',
                '',
                '- Flutter 完整测试：570 通过；30 个显式真实供应商用例默认跳过',
                '- DeepSeek `deepseek-v4-flash` 真实 canary：31/31 通过，密钥仅存在于测试进程',
                '- Chrome IndexedDB v1→v4 与原子写入：18 通过',
                '- `flutter analyze`、Go、Android APK/AAB、Web、OpenSpec 严格验证通过',
                '- 分支 CI 的 Flutter、Go、iOS `--no-codesign` 三项全绿',
                '- 40 个可达路由覆盖 320/390px、短屏/长屏、键盘、大字体、中英文与桌面 Web',
                '',
                '## 发布约束',
                '',
                '- 合并后先更新 241 后端并应用加法迁移，再部署不可变 Web release',
                '- `v1.3.0` 标签生成稳定签名 APK/AAB/Web ZIP 与校验文件',
                '- 必须完成 v1.2.1→v1.3.0 覆盖升级、签名、哈希和公开边界验证后，最后更新第一方 `latest.json`',
              ].join('\n'),
            });
            core.info(`Created ${created.data.html_url}`);
