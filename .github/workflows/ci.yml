name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

permissions:
  contents: read

jobs:
  flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Reject generated exports and password hashes
        run: tool/check_repository_hygiene.sh

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Flutter analyze
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: tool/run_ci_flutter_tests.sh

      - name: Verify Web IndexedDB v1 through v4 migrations plus atomic writes
        run: bash tool/test_agent_web.sh

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run backend tests
        run: go test ./...

  ios-release-build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build unsigned iOS release
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=BACKEND_URL=https://fittin.hammerscholar.net/api
