limit_req_zone $binary_remote_addr zone=fittin_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=fittin_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=fittin_agent:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name fittin.hammerscholar.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fittin.hammerscholar.net;

    ssl_certificate /etc/letsencrypt/live/fittin.hammerscholar.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fittin.hammerscholar.net/privkey.pem;

    root /home/wsf/nginx-fittin/current;
    index index.html;
    charset utf-8;
    client_max_body_size 12m;
    gzip_static on;
    gzip_vary on;

	location ^~ /api/v1/auth/ {
		limit_req zone=fittin_auth burst=8 nodelay;
		proxy_pass http://127.0.0.1:24181/v1/auth/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;
		proxy_connect_timeout 5s;
	}

	location = /api/v1/agent/chat-completions {
		limit_req zone=fittin_agent burst=4 nodelay;
		limit_req_status 429;
		error_page 413 = @fittin_agent_request_too_large;
		error_page 429 = @fittin_agent_rate_limited;
		client_max_body_size 512k;
		client_body_buffer_size 512k;
		proxy_pass http://127.0.0.1:24181/v1/agent/chat-completions;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 125s;
		proxy_send_timeout 30s;
		proxy_connect_timeout 5s;
	}

	location @fittin_agent_request_too_large {
		default_type application/json;
		add_header Cache-Control "no-store" always;
		include /etc/nginx/snippets/fittin-security-headers.conf;
		return 413 '{"error":"Agent request is too large","code":"relay_request_too_large"}';
	}

	location @fittin_agent_rate_limited {
		default_type application/json;
		add_header Cache-Control "no-store" always;
		include /etc/nginx/snippets/fittin-security-headers.conf;
		return 429 '{"error":"too many Agent requests","code":"agent_rate_limited"}';
	}

    location /api/ {
		limit_req zone=fittin_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:24181/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;
		proxy_connect_timeout 5s;
    }

	location = /index.html {
		try_files $uri =404;
		expires -1;
		add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
		include /etc/nginx/snippets/fittin-security-headers.conf;
	}

	location = /flutter_bootstrap.js {
		try_files $uri =404;
		expires -1;
		add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
		include /etc/nginx/snippets/fittin-security-headers.conf;
	}

	location = /main.dart.js {
		try_files $uri =404;
		expires -1;
		add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
		include /etc/nginx/snippets/fittin-security-headers.conf;
	}

	location = /flutter_service_worker.js {
		try_files $uri =404;
		expires -1;
		add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
		include /etc/nginx/snippets/fittin-security-headers.conf;
	}

	location = /version.json {
		try_files $uri =404;
		expires -1;
		add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
		include /etc/nginx/snippets/fittin-security-headers.conf;
	}

	location = /releases/latest.json {
		alias /home/wsf/nginx-fittin/public-releases/latest.json;
		expires -1;
		add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
		include /etc/nginx/snippets/fittin-security-headers.conf;
	}

	location ^~ /releases/ {
		alias /home/wsf/nginx-fittin/public-releases/;
		index index.html;
		autoindex off;
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		include /etc/nginx/snippets/fittin-security-headers.conf;
	}

	# Ubuntu's older nginx MIME table does not include WebAssembly. CanvasKit
	# requires application/wasm for WebAssembly.compileStreaming to succeed.
	location ~* "[._-][0-9a-f]{8,}\.wasm$" {
		try_files $uri =404;
		default_type application/wasm;
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		include /etc/nginx/snippets/fittin-security-headers.conf;
	}

	location ~* \.wasm$ {
		try_files $uri =404;
		default_type application/wasm;
		expires 1h;
		add_header Cache-Control "public, max-age=3600, must-revalidate" always;
		include /etc/nginx/snippets/fittin-security-headers.conf;
	}

	location ~* "[._-][0-9a-f]{8,}\.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$" {
        try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		include /etc/nginx/snippets/fittin-security-headers.conf;
	}

	location ~* \.(?:css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
		try_files $uri =404;
		expires 1h;
		add_header Cache-Control "public, max-age=3600, must-revalidate" always;
		include /etc/nginx/snippets/fittin-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
		add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
		include /etc/nginx/snippets/fittin-security-headers.conf;
    }

	include /etc/nginx/snippets/fittin-security-headers.conf;
}
